<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Científica</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style(2).css" />
</head>
<body>

  <div class="calc">

    <!-- Display -->
    <div class="display">
      <div class="expr"   id="expr"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- Teclado -->
    <div class="btns">

      <!-- Linha 1: funções básicas -->
      <button class="btn fn"  data-action="clear">AC</button>
      <button class="btn fn"  data-action="sign">+/−</button>
      <button class="btn fn"  data-action="percent">%</button>
      <button class="btn op"  data-action="op" data-val="÷">÷</button>

      <!-- Linhas 2–4: dígitos + operadores -->
      <button class="btn"     data-action="num" data-val="7">7</button>
      <button class="btn"     data-action="num" data-val="8">8</button>
      <button class="btn"     data-action="num" data-val="9">9</button>
      <button class="btn op"  data-action="op"  data-val="×">×</button>

      <button class="btn"     data-action="num" data-val="4">4</button>
      <button class="btn"     data-action="num" data-val="5">5</button>
      <button class="btn"     data-action="num" data-val="6">6</button>
      <button class="btn op"  data-action="op"  data-val="−">−</button>

      <button class="btn"     data-action="num" data-val="1">1</button>
      <button class="btn"     data-action="num" data-val="2">2</button>
      <button class="btn"     data-action="num" data-val="3">3</button>
      <button class="btn op"  data-action="op"  data-val="+">+</button>

      <button class="btn zero" data-action="num" data-val="0">0</button>
      <button class="btn"     data-action="dot">.</button>
      <button class="btn eq"  data-action="eq">=</button>

      <!-- Separador visual -->
      <div class="separator"></div>

      <!--
        Funções avançadas binárias (precisam de dois operandos):
          xʸ   → potenciação:     base xʸ expoente     ex: 2 xʸ 8   = 256
          x÷÷y → divisão inteira: x ÷÷ y               ex: 7 x÷÷y 2 = 3
          logₙ → logaritmo:       argumento logₙ base  ex: 8 logₙ 2 = 3
          ʸ√x  → radiciação:      radicando ʸ√x índice ex: 8 ʸ√x 3  = 2
      -->
      <button class="btn adv" data-action="op"    data-val="xʸ"   title="Potenciação">xʸ</button>
      <button class="btn adv" data-action="op"    data-val="x%y"  title="Divisão inteira">x÷÷y</button>
      <button class="btn adv" data-action="op"    data-val="logₙ" title="Logaritmo base n">logₙ</button>
      <button class="btn adv" data-action="op"    data-val="ʸ√x"  title="Radiciação">ʸ√x</button>

      <!-- Separador visual -->
      <div class="separator"></div>

      <!--
        Funções científicas unárias (operam sobre o número atual):

        TRIGONOMETRIA (entrada em graus):
          sin   → seno           ex: sin(30)  = 0.5
          cos   → cosseno        ex: cos(60)  = 0.5
          tan   → tangente       ex: tan(45)  = 1

        TRIGONOMETRIA INVERSA (resultado em graus):
          sin⁻¹ → arco-seno      ex: sin⁻¹(0.5) = 30
          cos⁻¹ → arco-cosseno   ex: cos⁻¹(0.5) = 60
          tan⁻¹ → arco-tangente  ex: tan⁻¹(1)   = 45

        OUTRAS:
          n!    → fatorial       ex: 5!  = 120
          ln    → log. natural   ex: ln(e) = 1
          log   → log. base 10   ex: log(100) = 2
          eˣ    → exponencial    ex: e^3 ≈ 20.09
      -->

      <!-- Linha trig direta -->
      <button class="btn sci" data-action="unary" data-val="sin"   title="Seno (graus)">sin</button>
      <button class="btn sci" data-action="unary" data-val="cos"   title="Cosseno (graus)">cos</button>
      <button class="btn sci" data-action="unary" data-val="tan"   title="Tangente (graus)">tan</button>
      <button class="btn sci" data-action="unary" data-val="fact"  title="Fatorial">n!</button>

      <!-- Linha trig inversa + logs -->
      <button class="btn sci" data-action="unary" data-val="asin"  title="Arco-seno (graus)">sin⁻¹</button>
      <button class="btn sci" data-action="unary" data-val="acos"  title="Arco-cosseno (graus)">cos⁻¹</button>
      <button class="btn sci" data-action="unary" data-val="atan"  title="Arco-tangente (graus)">tan⁻¹</button>
      <button class="btn sci" data-action="unary" data-val="ln"    title="Logaritmo natural">ln</button>

      <!-- Linha log10 + exp + constante π + constante e -->
      <button class="btn sci" data-action="unary" data-val="log10" title="Logaritmo base 10">log</button>
      <button class="btn sci" data-action="unary" data-val="exp"   title="e elevado a x">eˣ</button>
      <button class="btn sci const" data-action="const" data-val="pi"    title="Pi">π</button>
      <button class="btn sci const" data-action="const" data-val="e"     title="Número de Euler">e</button>

    </div>
  </div>

  <script src="script(1).js"></script>
</body>
</html>
